animations {
  enabled = no

  # Bezier curves for smooth acceleration/deceleration
  bezier = smoothInOut, 0.30, 0.15, 0.21, 1.00
  bezier = smoothOut, 0.0, 0, 0.6, 0.99
  bezier = smoothIn, 0.4, 0.0, 1.00, 1.00
  bezier = linear, 1, 1, 1, 1

  # Windows animations
  animation = windows, 1, 0.8, smoothInOut, popin
  animation = border, 1, 1, linear

  # Workspace animations
  animation = workspaces, 1, 0.7, smoothOut, slide

  animation = specialWorkspace, 1, 1.5, smoothInOut, slidevert
}

