# Decoration Settings

# Sourcing colors generated by wallust
source = $HOME/.config/hypr/UserConfigs/UserColors.conf

general {
  border_size = 2
  gaps_in = 5
  gaps_out = 3

  col.active_border   = 0xffcccccc
  col.inactive_border = 0xff111111
}

decoration {
  rounding = 4
  active_opacity = 1.1

  inactive_opacity = 1.1
  fullscreen_opacity = 1.0

  dim_inactive = false
  dim_strength = 0.5
  dim_special = 0.5

  shadow {
    enabled = true
    range = 1
    render_power = 1

    color =  $color12
    color_inactive = $color15
  }


  blur {
    enabled = true	
    size = 5
    passes = 2
    ignore_opacity = true
    new_optimizations = true
    special = true
    popups = true
  }
}

